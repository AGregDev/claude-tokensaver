name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  CLAUDE_CODE_VERSION: 2.1.292

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: npm

      - name: Install
        run: |
          npm ci
          npm install --global "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"

      - name: The tag matches the version
        run: test "${GITHUB_REF_NAME}" = "v$(node -p "require('./package.json').version")"

      # The same checks as CI: types, typecheck, lint, tests with coverage, engine tests, build.
      - name: Check
        run: |
          npm run types:sync
          npm run check

      - name: Package
        run: npm run package

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/*.tar.gz dist/*.sha256 --title "tokensaver ${GITHUB_REF_NAME}" --generate-notes --verify-tag
