name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The Claude Code release the mod is typed and tested against.
  CLAUDE_CODE_VERSION: 2.1.299

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: npm

      - name: Install
        run: npm ci

      # Claude Code supplies the mod API types, the validator and the test runner.
      # None of the steps below signs in or sends a model request.
      - name: Install Claude Code
        run: npm install --global "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"

      - name: Mod API types
        run: npm run types:sync

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit, safety, integration and UI tests with coverage
        run: npm run test:coverage

      - name: Tests inside Claude Code
        run: npm run test:mod

      # The floors are enforced by the tests above; this prints the numbers in the log.
      - name: Trimmer efficiency report
        run: npm run bench

      - name: Build
        run: npm run build
