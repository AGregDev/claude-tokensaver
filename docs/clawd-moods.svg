<svg xmlns="http://www.w3.org/2000/svg" width="640" height="110" viewBox="0 0 640 110" role="img" aria-label="Clawd's moods">
<title>Clawd's moods</title>
<style>
svg{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
.t{fill:#3b3530}
.d{fill:#8a817a}
.bubble{fill:#ffffff;stroke:#e6ddd6}
.track{fill:#efe8e2}
.tile{fill:#faf6f3;stroke:#eee5de}
@media (prefers-color-scheme:dark){
.t{fill:#ece6e1}.d{fill:#a59d96}.bubble{fill:#2b2724;stroke:#3d3733}.track{fill:#3a3430}.tile{fill:#262220;stroke:#352f2b}
}
.c *{transform-box:fill-box;transform-origin:center}

@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes look{0%,40%,100%{transform:translateX(0)}50%,90%{transform:translateX(5px)}}
@keyframes walkA{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes walkB{0%,100%{transform:translateY(-4px)}50%{transform:translateY(0)}}
@keyframes jump{0%,100%{transform:translateY(0)}30%{transform:translateY(-16px) scaleY(1.04)}55%{transform:translateY(0) scaleY(.92)}70%{transform:translateY(-4px)}}
@keyframes chomp{0%,100%{transform:scaleY(.15)}50%{transform:scaleY(1)}}
@keyframes crumb{0%{transform:translate(0,0) scale(1);opacity:0}15%{opacity:1}100%{transform:translate(-78px,6px) scale(.3);opacity:0}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-2px)}40%{transform:translateX(2px)}60%{transform:translateX(-1px)}80%{transform:translateX(1px)}}
@keyframes drip{0%{transform:translateY(0);opacity:0}20%{opacity:1}100%{transform:translateY(18px);opacity:0}}
@keyframes zzz{0%{transform:translate(0,0) scale(.6);opacity:0}30%{opacity:1}100%{transform:translate(14px,-26px) scale(1.15);opacity:0}}
@keyframes spark{0%,100%{transform:scale(0) rotate(0);opacity:0}40%{transform:scale(1) rotate(45deg);opacity:1}70%{opacity:.8}}
@keyframes pop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.08);opacity:1}100%{transform:scale(1)}}
@keyframes breathe{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.96)}}
@keyframes flow{from{background-position:0 0}to{background-position:12px 0}}
@keyframes dash{to{stroke-dashoffset:-12}}
.idle .whole{animation:bob 2.8s ease-in-out infinite}
.idle .eyes,.busy .eyes,.happy .eyes,.chomp .eyes{animation:blink 4.2s infinite}
.busy .whole{animation:bob 1.1s ease-in-out infinite}
.busy .pupils{animation:look 2.4s ease-in-out infinite}
.busy .legA{animation:walkA .5s steps(2) infinite}
.busy .legB{animation:walkB .5s steps(2) infinite}
.happy .whole{animation:jump 1.2s ease-out infinite}
.happy .spark{animation:spark 1.2s ease-out infinite}
.chomp .whole{animation:bob .45s ease-in-out infinite}
.chomp .mouth{animation:chomp .3s ease-in-out infinite}
.chomp .crumb{animation:crumb 1.1s linear infinite}
.worried .whole{animation:shake .9s ease-in-out infinite}
.worried .drop{animation:drip 1.6s ease-in infinite}
.sleepy .whole{animation:breathe 3.6s ease-in-out infinite}
.sleepy .z{animation:zzz 2.7s ease-out infinite}
.alert .whole{animation:shake .4s ease-in-out infinite}
.alert .bang{animation:pop .5s ease-out both}
.pop{animation:pop .45s ease-out both}
.flowing{animation:dash .8s linear infinite}
</style>
<g class="c idle" transform="translate(10.7 26)"><ellipse cx="35" cy="52" rx="27.5" ry="2.75" fill="#000" opacity=".12"/><g class="whole"><g class="legA"><rect x="15" y="40" width="5" height="10" fill="#B85C3E"/><rect x="40" y="40" width="5" height="10" fill="#B85C3E"/></g><g class="legB"><rect x="25" y="40" width="5" height="10" fill="#B85C3E"/><rect x="50" y="40" width="5" height="10" fill="#B85C3E"/></g><rect x="10" y="0" width="50" height="40" fill="#D97757"/><rect x="0" y="20" width="10" height="10" fill="#D97757"/><rect x="60" y="20" width="10" height="10" fill="#D97757"/><rect x="10" y="35" width="50" height="5" fill="#B85C3E"/><g class="eyes"><g class="pupils"><rect x="20" y="10" width="5" height="10" fill="#1F1A17"/><rect x="45" y="10" width="5" height="10" fill="#1F1A17"/></g></g></g></g><text class="d" x="45.7" y="104" font-size="12" text-anchor="middle">idle</text>
<g class="c chomp" transform="translate(102.1 26)"><ellipse cx="35" cy="52" rx="27.5" ry="2.75" fill="#000" opacity=".12"/><g class="whole"><g class="legA"><rect x="15" y="40" width="5" height="10" fill="#B85C3E"/><rect x="40" y="40" width="5" height="10" fill="#B85C3E"/></g><g class="legB"><rect x="25" y="40" width="5" height="10" fill="#B85C3E"/><rect x="50" y="40" width="5" height="10" fill="#B85C3E"/></g><rect x="10" y="0" width="50" height="40" fill="#D97757"/><rect x="0" y="20" width="10" height="10" fill="#D97757"/><rect x="60" y="20" width="10" height="10" fill="#D97757"/><rect x="10" y="35" width="50" height="5" fill="#B85C3E"/><g class="eyes"><g class="pupils"><rect x="20" y="10" width="5" height="10" fill="#1F1A17"/><rect x="45" y="10" width="5" height="10" fill="#1F1A17"/></g></g><g class="mouth"><rect x="27.5" y="25" width="15" height="6" fill="#1F1A17"/></g><g class="crumb" style="animation-delay:0s"><rect x="85" y="21.5" width="4.5" height="4.5" fill="#7B83EB"/></g><g class="crumb" style="animation-delay:0.27s"><rect x="90" y="24" width="4.5" height="4.5" fill="#3FA55B"/></g><g class="crumb" style="animation-delay:0.54s"><rect x="85" y="26.5" width="4.5" height="4.5" fill="#7B83EB"/></g><g class="crumb" style="animation-delay:0.81s"><rect x="90" y="21.5" width="4.5" height="4.5" fill="#3FA55B"/></g></g></g><text class="d" x="137.1" y="104" font-size="12" text-anchor="middle">eating noise</text>
<g class="c happy" transform="translate(193.6 26)"><ellipse cx="35" cy="52" rx="27.5" ry="2.75" fill="#000" opacity=".12"/><g class="whole"><g class="legA"><rect x="15" y="40" width="5" height="10" fill="#B85C3E"/><rect x="40" y="40" width="5" height="10" fill="#B85C3E"/></g><g class="legB"><rect x="25" y="40" width="5" height="10" fill="#B85C3E"/><rect x="50" y="40" width="5" height="10" fill="#B85C3E"/></g><rect x="10" y="0" width="50" height="40" fill="#D97757"/><rect x="0" y="20" width="10" height="10" fill="#D97757"/><rect x="60" y="20" width="10" height="10" fill="#D97757"/><rect x="10" y="35" width="50" height="5" fill="#B85C3E"/><g class="eyes"><g class="pupils"><rect x="20" y="10" width="5" height="10" fill="#1F1A17"/><rect x="45" y="10" width="5" height="10" fill="#1F1A17"/></g></g><path class="spark" style="animation-delay:0s" transform="translate(-7.5 2.5)" d="M0 -5 L1.4000000000000001 -1.4000000000000001 L5 0 L1.4000000000000001 1.4000000000000001 L0 5 L-1.4000000000000001 1.4000000000000001 L-5 0 L-1.4000000000000001 -1.4000000000000001Z" fill="#F2B84B"/><path class="spark" style="animation-delay:0.18s" transform="translate(71.5 5)" d="M0 -5 L1.4000000000000001 -1.4000000000000001 L5 0 L1.4000000000000001 1.4000000000000001 L0 5 L-1.4000000000000001 1.4000000000000001 L-5 0 L-1.4000000000000001 -1.4000000000000001Z" fill="#F2B84B"/><path class="spark" style="animation-delay:0.36s" transform="translate(0 -9)" d="M0 -5 L1.4000000000000001 -1.4000000000000001 L5 0 L1.4000000000000001 1.4000000000000001 L0 5 L-1.4000000000000001 1.4000000000000001 L-5 0 L-1.4000000000000001 -1.4000000000000001Z" fill="#F2B84B"/><path class="spark" style="animation-delay:0.54s" transform="translate(65 -7.5)" d="M0 -5 L1.4000000000000001 -1.4000000000000001 L5 0 L1.4000000000000001 1.4000000000000001 L0 5 L-1.4000000000000001 1.4000000000000001 L-5 0 L-1.4000000000000001 -1.4000000000000001Z" fill="#F2B84B"/></g></g><text class="d" x="228.6" y="104" font-size="12" text-anchor="middle">compacted</text>
<g class="c busy" transform="translate(285.0 26)"><ellipse cx="35" cy="52" rx="27.5" ry="2.75" fill="#000" opacity=".12"/><g class="whole"><g class="legA"><rect x="15" y="40" width="5" height="10" fill="#B85C3E"/><rect x="40" y="40" width="5" height="10" fill="#B85C3E"/></g><g class="legB"><rect x="25" y="40" width="5" height="10" fill="#B85C3E"/><rect x="50" y="40" width="5" height="10" fill="#B85C3E"/></g><rect x="10" y="0" width="50" height="40" fill="#D97757"/><rect x="0" y="20" width="10" height="10" fill="#D97757"/><rect x="60" y="20" width="10" height="10" fill="#D97757"/><rect x="10" y="35" width="50" height="5" fill="#B85C3E"/><g class="eyes"><g class="pupils"><rect x="20" y="10" width="5" height="10" fill="#1F1A17"/><rect x="45" y="10" width="5" height="10" fill="#1F1A17"/></g></g></g></g><text class="d" x="320.0" y="104" font-size="12" text-anchor="middle">helpers running</text>
<g class="c worried" transform="translate(376.4 26)"><ellipse cx="35" cy="52" rx="27.5" ry="2.75" fill="#000" opacity=".12"/><g class="whole"><g class="legA"><rect x="15" y="40" width="5" height="10" fill="#B85C3E"/><rect x="40" y="40" width="5" height="10" fill="#B85C3E"/></g><g class="legB"><rect x="25" y="40" width="5" height="10" fill="#B85C3E"/><rect x="50" y="40" width="5" height="10" fill="#B85C3E"/></g><rect x="10" y="0" width="50" height="40" fill="#D97757"/><rect x="0" y="20" width="10" height="10" fill="#D97757"/><rect x="60" y="20" width="10" height="10" fill="#D97757"/><rect x="10" y="35" width="50" height="5" fill="#B85C3E"/><g class="eyes"><g class="pupils"><rect x="20" y="10" width="5" height="10" fill="#1F1A17"/><rect x="45" y="10" width="5" height="10" fill="#1F1A17"/></g></g><path class="drop" d="M62 1 q3.5 5.5 0 8 q-3.5 -2.5 0 -8z" fill="#6FB7E9"/></g></g><text class="d" x="411.4" y="104" font-size="12" text-anchor="middle">context 74%</text>
<g class="c sleepy" transform="translate(467.9 26)"><ellipse cx="35" cy="52" rx="27.5" ry="2.75" fill="#000" opacity=".12"/><g class="whole"><g class="legA"><rect x="15" y="40" width="5" height="10" fill="#B85C3E"/><rect x="40" y="40" width="5" height="10" fill="#B85C3E"/></g><g class="legB"><rect x="25" y="40" width="5" height="10" fill="#B85C3E"/><rect x="50" y="40" width="5" height="10" fill="#B85C3E"/></g><rect x="10" y="0" width="50" height="40" fill="#D97757"/><rect x="0" y="20" width="10" height="10" fill="#D97757"/><rect x="60" y="20" width="10" height="10" fill="#D97757"/><rect x="10" y="35" width="50" height="5" fill="#B85C3E"/><g class="eyes"><rect x="18" y="16" width="8" height="2.25" fill="#1F1A17"/><rect x="44" y="16" width="8" height="2.25" fill="#1F1A17"/></g><text class="t z" x="62.5" y="2.5" font-size="7" font-weight="700" style="animation-delay:0s">z</text><text class="t z" x="62.5" y="2.5" font-size="9" font-weight="700" style="animation-delay:0.9s">z</text><text class="t z" x="62.5" y="2.5" font-size="11" font-weight="700" style="animation-delay:1.8s">Z</text></g></g><text class="d" x="502.9" y="104" font-size="12" text-anchor="middle">cache cold</text>
<g class="c alert" transform="translate(559.3 26)"><ellipse cx="35" cy="52" rx="27.5" ry="2.75" fill="#000" opacity=".12"/><g class="whole"><g class="legA"><rect x="15" y="40" width="5" height="10" fill="#B85C3E"/><rect x="40" y="40" width="5" height="10" fill="#B85C3E"/></g><g class="legB"><rect x="25" y="40" width="5" height="10" fill="#B85C3E"/><rect x="50" y="40" width="5" height="10" fill="#B85C3E"/></g><rect x="10" y="0" width="50" height="40" fill="#D97757"/><rect x="0" y="20" width="10" height="10" fill="#D97757"/><rect x="60" y="20" width="10" height="10" fill="#D97757"/><rect x="10" y="35" width="50" height="5" fill="#B85C3E"/><g class="eyes"><g class="pupils"><rect x="20" y="10" width="5" height="10" fill="#1F1A17"/><rect x="45" y="10" width="5" height="10" fill="#1F1A17"/></g></g><text class="t bang" x="31" y="-3" font-size="13" font-weight="800" fill="#E5484D" style="fill:#E5484D">!</text></g></g><text class="d" x="594.3" y="104" font-size="12" text-anchor="middle">escalated</text>
</svg>
